name: SEO Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/seo/**"
      - "components/seo/**"
      - "app/sitemap*.ts"
      - "app/sitemap*/**"
      - "public/robots.txt"
      - "content/**"
      - "app/locations/**"
  push:
    branches: [main]
    paths:
      - "lib/seo/**"
      - "public/robots.txt"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check robots.txt syntax
        run: |
          echo "Validating robots.txt..."
          if ! head -1 public/robots.txt | grep -q "^#"; then
            echo "ERROR: robots.txt must start with a comment"
            exit 1
          fi
          if ! grep -q "Sitemap:" public/robots.txt; then
            echo "ERROR: robots.txt missing Sitemap entries"
            exit 1
          fi
          echo "robots.txt OK"

      - name: Check no PII in sitemaps
        run: |
          echo "Checking sitemap files for PII..."
          if grep -r "profile" app/sitemap*.ts 2>/dev/null | grep -qv "profile\|Profile\|PROFILE"; then
            echo "WARNING: sitemap references profile pages — ensure no PII is indexed"
          fi
          echo "Sitemap PII check passed"

      - name: Check JSON-LD schema validity
        run: |
          echo "Checking for valid JSON-LD patterns..."
          if grep -q "@context" components/seo/JsonLd.tsx 2>/dev/null; then
            echo "JSON-Ld component uses @context — OK"
          else
            echo "WARNING: JsonLd component may not use @context"
          fi
          echo "Schema check complete"

      - name: Verify location data completeness
        run: |
          echo "Checking location data..."
          node -e "
            const { getAllLocations, getCountiesWithLocations } = require('./lib/seo/location-data.ts') || {};
          " 2>/dev/null || echo "Note: location-data.ts requires TS transform — verify manually during build"

      - name: Build check
        run: npm run build -- --webpack
        continue-on-error: true
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: placeholder
